# 运控闭环。策略 onnx 训练好后把 model 改成文件路径。
hz 50
can can0
engine auto
model none
ort
qnn_backend libQnnHtp.so
gamepad /dev/input/js0
motor_type 4538_19
action_scale 0.25
vel_limit 1.0
torque_nm 1.2
max_vx 0.5
max_vx_back 0.3
max_vy 0.3
max_vyaw 0.8
deadzone 0.12
print_hz 2
ramp_s 2
motor_timeout_ms 100

# 策略关节顺序与 microduck 一致（不含嘴）。can_id 按本机接线改。
# joint 名字  CAN_ID  训练零位rad
joint left_hip_yaw 1 0.0
joint left_hip_roll 2 -0.0873
joint left_hip_pitch 3 -0.4579
joint left_knee 4 -0.0049
joint left_ankle 5 0.4530
joint neck_pitch 6 0.3491
joint head_pitch 7 0.3491
joint head_yaw 8 0.0
joint head_roll 9 0.0
joint right_hip_yaw 10 0.0
joint right_hip_roll 11 0.0873
joint right_hip_pitch 12 0.4579
joint right_knee 13 0.0049
joint right_ankle 14 -0.4530
