# HT-DK 行走。力矩和指令缩放保持第一次上电的值，核对通过前不要加大。
hz 50
can can0
engine auto
model none
ort
qnn_backend libQnnHtp.so
gamepad /dev/input/js0
motor_type 4538_19
imu_mount config/imu_mount.json
tau_max_leg 0.5
cmd_scale 0.25
vel_limit 1.0
max_vx 0.4
max_vx_back 0.4
max_vy 0.3
max_vyaw 1.0
deadzone 0.12
print_hz 2
ramp_s 2
motor_timeout_ms 100

# 行序是策略下标，不是电机号。CAN_ID 是实机号。
# 右腿 1 踝、2 膝、3 髋 pitch、4 髋 roll、5 髋 yaw。左腿 6–10 同样从踝到髋 yaw。
# 头 neck：head pitch 11，neck pitch 12，head roll 13，head yaw 14。嘴 15 不在表里，保持 0。
# joint 名字  CAN_ID  home_rad
joint l_hip_yaw 10 0.0
joint l_hip_roll 9 0.0
joint l_hip_pitch 8 0.68
joint l_calf 7 -0.88
joint l_ankle 6 0.21
joint neck_pitch 12 0.52
joint head_pitch 11 -0.50
joint head_yaw 14 0.0
joint head_roll 13 0.0
joint r_hip_yaw 5 0.0
joint r_hip_roll 4 0.0
joint r_hip_pitch 3 0.68
joint r_calf 2 -0.88
joint r_ankle 1 0.21
