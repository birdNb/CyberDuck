port: /dev/ttyMSM0
baudrate: 1000000
timeout_s: 0.08
model: HD1910M
default_speed: 20
default_acceleration: 20
# 200 means 20% of the model's maximum torque. Raise only after testing.
torque_limit: 200

# These are logical angle settings for the three head servos.
# Verify center and limits mechanically before enabling motion.
servos:
  head_pitch:
    id: 1
    center_deg: 180.0
    center_raw: 2048
    min_deg: 135.0
    max_deg: 225.0
    direction: 1
  head_yaw:
    id: 2
    center_deg: 180.0
    center_raw: 2048
    min_deg: 100.0
    max_deg: 260.0
    direction: 1
  head_roll:
    id: 3
    center_deg: 180.0
    center_raw: 2048
    min_deg: 155.0
    max_deg: 205.0
    direction: 1
  mouth:
    id: 15
    center_deg: 180.0
    # 闭嘴实测原始值。张嘴 60°，方向与原始值增大相反。0~4096 对应 0~360°。
    center_raw: 1001
    min_deg: 180.0
    max_deg: 240.0
    direction: -1

